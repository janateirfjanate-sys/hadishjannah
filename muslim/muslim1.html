<script>
    function scrollToTop() {
    
        window.location.href = '/muslim.html';

        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    let audio = new Audio("1mhadess.mpeg");
    let isPlaying = false;

    function show() {
        if (!isPlaying) {
            audio.play()
                .then(() => { isPlaying = true; })
                .catch((error) => console.error("Error playing audio:", error));
        } else {
            audio.pause();
            audio.currentTime = 0;
            isPlaying = false;
        }
    }
</script>
